name: Deploy Workspace public website

# Automatically release only after a successful push validation on main.
# Keep manual deployment available for controlled recoveries.
on:
  workflow_run:
    workflows: ["Validate public website"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-emlen-public-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Release validated main commit to Contabo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Prepare pinned SSH identity
        shell: bash
        env:
          WE_DEPLOY_KEY: ${{ secrets.WE_DEPLOY_KEY }}
          WE_SSH_KNOWN_HOSTS: ${{ secrets.WE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$WE_DEPLOY_KEY" ]] || { echo "Missing WE_DEPLOY_KEY secret"; exit 1; }
          [[ -n "$WE_SSH_KNOWN_HOSTS" ]] || { echo "Missing WE_SSH_KNOWN_HOSTS secret"; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$WE_DEPLOY_KEY" > "$HOME/.ssh/we_actions_deploy"
          printf '%s\n' "$WE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/we_actions_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/we_actions_deploy" >/dev/null
          ssh-keygen -F 91.90.83.21 >/dev/null || { echo "Pinned Contabo host key not found"; exit 1; }

      - name: Deploy verified commit
        shell: bash
        env:
          REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          ssh -i "$HOME/.ssh/we_actions_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -T we-actions@91.90.83.21 "deploy $REVISION"

      - name: Confirm live noindex headers and empty sitemap
        shell: bash
        run: |
          set -euo pipefail
          for path in / /workspaces/ /managed-office/south-bangalore/ /managed-office/one-person-office/; do
            response="$(curl --silent --show-error --fail --max-time 25 \
              -H 'Cache-Control: no-cache' \
              -D - -o /dev/null "https://workspacebyemlen.co.uk$path")"
            printf '%s\n' "$response" | grep -Eiq '^x-robots-tag:[[:space:]]*noindex, nofollow' || {
              echo "Missing noindex/nofollow header on $path" >&2
              exit 1
            }
          done
          sitemap="$(curl --silent --show-error --fail --max-time 25 https://workspacebyemlen.co.uk/sitemap.xml)"
          if grep -Eq '<(url|loc)([[:space:]]|>)' <<< "$sitemap"; then
            echo "Public sitemap unexpectedly contains crawlable URLs" >&2
            exit 1
          fi
          robots="$(curl --silent --show-error --fail --max-time 25 https://workspacebyemlen.co.uk/robots.txt)"
          if grep -Eiq '^Sitemap:' <<< "$robots"; then
            echo "robots.txt must not advertise a sitemap" >&2
            exit 1
          fi
          echo "Live .co.uk SEO suppression verified"
