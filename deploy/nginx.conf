# nginx server block. Put the contents of public/ in /var/www/emlen (or change root).
# Add TLS with certbot (certbot --nginx -d workspacebyemlen.co.uk -d www.workspacebyemlen.co.uk).
server {
    listen 80;
    server_name workspacebyemlen.co.uk www.workspacebyemlen.co.uk;
    root /var/www/emlen;
    index index.html;

    # --- compression (add brotli if your build has it) ---
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

    # --- security headers ---
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https:; base-uri 'self'; form-action 'self' https://wa.me; object-src 'none'; frame-ancestors 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # once https is live

    error_page 404 /404.html;
    location = /404.html { internal; }

    # clean URLs: /workspaces -> /workspaces/ (nginx does this redirect itself for directories)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # add_header must be repeated: nginx drops parent add_header lines inside a location that defines its own
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https:; base-uri 'self'; form-action 'self' https://wa.me; object-src 'none'; frame-ancestors 'self'" always;
    }

    # fingerprinted assets: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    }
    # ...except the file you edit after deploy
    location = /assets/js/config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    }

    location = /managed-office/ { return 301 /managed-office/south-bangalore/; }
    location = /managed-office  { return 301 /managed-office/south-bangalore/; }
    location ~ /\.(?!well-known) { deny all; }
}
